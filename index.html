<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/src/main.css">
    <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>
</head>

<body>
    <section id="intro">
        <header>
            <h1>Portfolio</h1>
        </header>
        <div class="intro-layout">
            <img class="profile-picture" width="300vw" src="/static/deskphoto.jpg" alt="">
            <div>
                <h1 class="text-center text-primary">Giancarlo J. Blas Marte</h1>
                <div id="typed-strings">
                  <h2 class="text-primary">UX/UI Designer</h2>
                  <h2 class="text-primary">Content Creator</h2>
                </div>
                <div class="text-center text-secondary" style="text-align: center;">
                    <span id="epithets"></span>
                </div>
                <div class="flex-row">
                    <h2 class="text-secondary" style="min-height: 2rem;"></h2>
                </div>
            </div>
            <div class="transparent-card">
                <p class="text-center text-primary">
                    Welcome to my portfolio. This page features my work in UX/UI and Content Creation.
                </p>
            </div>
        </div>
    </section>
    <!-- TODO -->
    <!-- <section id="about-me">
    </section>
    <footer>

    </footer> -->
    <script>
        // Initializes auto-typing in intro section
        // https://github.com/mattboldt/typed.js/
        var typed = new Typed("#epithets", {
            stringsElement: '#typed-strings',
            typeSpeed: 50,
            loop: true,
            backSpeed: 50,
            backDelay: 2000,
            showCursor: true,
            cursorChar: '|',
            autoInsertCss: true,
        })
    </script>
</body>

</html>
